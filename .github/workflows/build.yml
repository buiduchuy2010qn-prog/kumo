name: Build & Release Kumo Setup

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag phien ban de phat hanh Release (vd: v1.0.0, de trong neu chi build Artifact)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build KumoSetup.exe on GitHub Cloud (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Tạo Icon & Biên dịch KumoSetup.exe trên GitHub Cloud
        shell: pwsh
        run: |
          Remove-Item .\Kumo.ico -Force -ErrorAction SilentlyContinue
          powershell -ExecutionPolicy Bypass -File .\GenerateLogo.ps1 -OutDir .
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Kiểm thử tự động & Tạo mã băm SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifacts_preview -Force | Out-Null
          Start-Process -FilePath .\KumoSetup.exe -ArgumentList @("--preview-setup", ".\artifacts_preview") -Wait
          if (-not (Test-Path ".\artifacts_preview\preview_kumo_setup_welcome.png")) {
            throw "Setup UI smoke test failed!"
          }
          $hash = (Get-FileHash .\KumoSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  KumoSetup.exe" | Set-Content -Path .\SHA256SUMS.txt -Encoding ASCII
          Get-Item .\Kumo.exe, .\KumoSetup.exe, .\SHA256SUMS.txt | Select-Object Name, Length
          Write-Host "SHA256(KumoSetup.exe) = $hash"

      - name: Đóng gói KumoSetup Artifact trên GitHub
        uses: actions/upload-artifact@v4
        with:
          name: KumoSetup-Windows-x64
          path: |
            KumoSetup.exe
            SHA256SUMS.txt

      - name: Tự động phát hành / cập nhật GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:GITHUB_REF_NAME }
          Write-Host "Uploading cloud-built KumoSetup.exe to GitHub Release $tag..."
          $exists = $true
          try { gh release view $tag | Out-Null } catch { $exists = $false }
          if (-not $exists) {
            gh release create $tag .\KumoSetup.exe .\SHA256SUMS.txt --title "Kumo $tag — Official Windows Setup" --generate-notes
          } else {
            gh release upload $tag .\KumoSetup.exe .\SHA256SUMS.txt --clobber
          }